name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install pyyaml
      - run: python tools/validate_skills.py

  smoke:
    name: Render smoke test (exam-prep)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Python packages
        run: pip install matplotlib scipy sympy
      - name: Node packages and Chromium
        run: |
          npm install --silent --prefix ~/.exam-prep-deps katex marked playwright mermaid
          npx --prefix ~/.exam-prep-deps playwright install --with-deps chromium
      - run: python tools/smoke_test.py --out dist/smoke
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-pdfs
          path: dist/smoke/*.pdf
