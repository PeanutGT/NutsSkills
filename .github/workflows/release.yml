name: Release

# Push a tag named <skill-name>-v<version>, e.g. exam-prep-v2.0.0
on:
  push:
    tags: ["*-v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pyyaml

      - name: Parse tag
        id: tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          SKILL="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "skill=$SKILL" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -f "skills/$SKILL/SKILL.md" || { echo "::error::skills/$SKILL/SKILL.md not found"; exit 1; }
          DECLARED=$(python - "$SKILL" <<'PY'
          import re, sys, yaml
          text = open(f"skills/{sys.argv[1]}/SKILL.md", encoding="utf-8").read()
          fm = yaml.safe_load(re.match(r"^---\n(.*?)\n---\n", text, re.S).group(1))
          print((fm.get("metadata") or {}).get("version", ""))
          PY
          )
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match metadata.version $DECLARED in skills/$SKILL/SKILL.md"
            exit 1
          fi

      - run: python tools/validate_skills.py "${{ steps.tag.outputs.skill }}"

      - name: Build zip
        run: python tools/build_zip.py "${{ steps.tag.outputs.skill }}"

      - name: Release notes from CHANGELOG
        run: |
          python - "${{ steps.tag.outputs.skill }}" "${{ steps.tag.outputs.version }}" > notes.md <<'PY'
          import re, sys
          skill, version = sys.argv[1], sys.argv[2]
          text = open(f"skills/{skill}/CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^##\s*\[?{re.escape(version)}\]?.*?\n(.*?)(?=^##\s|\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else ""
          print(body)
          print()
          print("---")
          print(f"**安裝 Install**：下載下方的 `{skill}-{version}.zip`，到 Claude.ai 的 Customize → Skills → ＋ → Upload a skill 上傳（不用解壓縮）。"
                " Claude Code：`/plugin marketplace add PeanutGT/NutsSkills`。詳見 [README](https://github.com/PeanutGT/NutsSkills#安裝)。")
          PY
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tag.outputs.skill }} v${{ steps.tag.outputs.version }}
          body_path: notes.md
          files: dist/${{ steps.tag.outputs.skill }}-${{ steps.tag.outputs.version }}.zip
