name: Release

# Two ways to release:
#   1. GitHub → Actions → Release → Run workflow, pick the skill or suite
#   2. Push a tag named <name>-v<version>, e.g. exam-prep-v2.0.0 or nuts-engineering-v1.1.0
# A skill releases its own zip at the metadata.version in its SKILL.md. A suite (a marketplace
# plugin listing several skills) releases one zip per skill at the version in suites/<name>/CHANGELOG.md.
on:
  push:
    tags: ["*-v*.*.*"]
  workflow_dispatch:
    inputs:
      skill:
        description: "Skill folder under skills/, or a suite name such as nuts-engineering"
        required: true
        default: exam-prep

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install pyyaml

      - name: Resolve skill or suite and version
        id: tag
        env:
          INPUT_SKILL: ${{ inputs.skill }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            NAME="${INPUT_SKILL}"
          else
            NAME="${GITHUB_REF_NAME%-v*}"
          fi
          INFO=$(python tools/release_target.py "$NAME") || { echo "::error::cannot release '$NAME'"; exit 1; }
          field() { echo "$INFO" | python -c "import json, sys; v = json.load(sys.stdin)['$1']; print(' '.join(v) if isinstance(v, list) else v)"; }
          DECLARED=$(field version)
          SOURCE=$(field changelog)
          if [ "$(field kind)" = "skill" ]; then SOURCE="metadata.version in skills/$NAME/SKILL.md"; fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="$DECLARED"
            if git ls-remote --exit-code --tags origin "refs/tags/$NAME-v$VERSION" >/dev/null; then
              echo "::error::$NAME-v$VERSION has already been released. Bump the version in $SOURCE first."
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME##*-v}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "skills=$(field skills)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NAME-v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "::error::Tag version $VERSION does not match $DECLARED ($SOURCE)"
            exit 1
          fi

      - run: python tools/validate_skills.py ${{ steps.tag.outputs.skills }}

      - name: Build zips
        run: for s in ${{ steps.tag.outputs.skills }}; do python tools/build_zip.py "$s"; done

      - name: Release notes from CHANGELOG
        run: |
          python tools/release_target.py "${{ steps.tag.outputs.name }}" --notes "${{ steps.tag.outputs.version }}" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.tag.outputs.name }} v${{ steps.tag.outputs.version }}
          body_path: notes.md
          files: dist/*.zip
